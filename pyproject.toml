[project]
name = "SM-Object-Storage"
version = "2.0.0"
description = "企业对象存储：桶、对象存取、元数据与 SM3 完整性校验"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
