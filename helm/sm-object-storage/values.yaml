# SM-* 微服务 Helm Values - 对象存储服务
# release 名：sm-object-storage，容器端口：8022，数据库：sm_object_storage

replicaCount: 2

image:
  repository: ghcr.io/luoshitianchen/sm-object-storage
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# 基于真实 benchmark-results.json 的资源建议（50并发压测：有效吞吐40-75QPS，P99~900ms，内存~100MB）
# 低流量服务起始值；如属高流量链路可上调 requests.cpu 到 200m
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

service:
  type: ClusterIP
  port: 80
  targetPort: 8022   # 与服务本地监听端口一致

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  hosts:
    - host: sm-object-storage.sm.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sm-tls
      hosts:
        - sm-object-storage.sm.example.com

# 对象存储后端 PVC 持久化配置（注释说明，按需启用）
# 对象存储服务的元数据/本地缓存需要持久卷承载，真实后端通常对接 S3/MinIO/CEPH。
# persistence.enabled 设为 true 时，deployment 会挂载 data 卷到 /data。
persistence:
  enabled: false            # true 时创建 PVC 并挂载到容器 /data（对象数据暂存/缓存目录）
  storageClass: "local-path" # 生产建议替换为 SSD 类型 StorageClass（如 ceph-rbd / openebs）
  accessModes:
    - ReadWriteOnce
  size: 50Gi               # 元数据与分片临时区容量；对象本体建议直连 S3 后端，不占用此卷
  existingClaim: ""         # 若已有 PVC，填写名称则不再新建

# 非敏感配置 -> ConfigMap
config:
  SM_ENV: production
  SM_LOG_LEVEL: info
  SM_DATABASE_HOST: postgres-primary.sm-prod.svc.cluster.local
  SM_DATABASE_PORT: "5432"
  SM_DATABASE_NAME: sm_object_storage

# 敏感配置 -> Secret（生产环境通过 ExternalSecret 从 Vault 注入）
secret:
  SM_INTERNAL_API_KEY: ""
  SM_SM4_KEY_HEX: ""
  SM_DATABASE_URL: ""

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

networkPolicy:
  enabled: true
  ingressFrom:
    - namespace: sm-prod
    - namespace: ingress-nginx
  egressTo:
    - namespace: kube-system   # DNS
    - namespace: sm-prod      # 同命名空间服务

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
